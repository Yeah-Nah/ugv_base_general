steps:
  - id: compile-firmware
    name: ubuntu:22.04
    entrypoint: bash
    args:
      - -ceu
      - |
        set -a
        source .cloudbuild/dev/version.env
        set +a

        # Escape Bash variables so Cloud Build leaves expansion to Bash.
        for required_version in \
          "$$ARDUINO_CLI_VERSION" \
          "$$ARDUINOJSON_VERSION" \
          "$$ADAFRUIT_SSD1306_VERSION" \
          "$$ADAFRUIT_GFX_VERSION" \
          "$$INA219_WE_VERSION" \
          "$$ESP32_ENCODER_VERSION" \
          "$$PID_V2_VERSION" \
          "$$SIMPLE_KALMAN_FILTER_VERSION" \
          "$$ADAFRUIT_ICM20X_VERSION" \
          "$$ADAFRUIT_BUSIO_VERSION" \
          "$$ADAFRUIT_SENSOR_VERSION"; do
          if [[ "$$required_version" == REPLACE_WITH_VERIFIED_VERSION ]]; then
            echo "A dependency version is still a placeholder in version.env" >&2
            exit 1
          fi
        done

        apt-get update
        apt-get install --no-install-recommends --yes ca-certificates curl tar python3 python3-pip
        # ESP32 core 2.0.14 invokes Python-based esptool during binary generation.
        python3 -m pip install --no-cache-dir "esptool==4.5.1"

        curl --fail --silent --show-error --location \
          "https://downloads.arduino.cc/arduino-cli/arduino-cli_$${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
          --output /tmp/arduino-cli.tar.gz
        tar --extract --gzip --file /tmp/arduino-cli.tar.gz --directory /usr/local/bin arduino-cli
        chmod +x /usr/local/bin/arduino-cli

        export ARDUINO_DATA_DIR=/workspace/.arduino-data
        export ARDUINO_USER_DIR=/workspace/.arduino-user
        mkdir --parents "$$ARDUINO_DATA_DIR" "$$ARDUINO_USER_DIR/libraries"

        arduino-cli config init --dest-dir "$$ARDUINO_DATA_DIR"
        arduino-cli config set directories.data "$$ARDUINO_DATA_DIR" --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"
        arduino-cli config set directories.user "$$ARDUINO_USER_DIR" --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"
        arduino-cli core update-index --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"
        arduino-cli core install "esp32:esp32@$$ESP32_CORE_VERSION" --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"

        arduino-cli lib update-index --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"
        # Install the complete pinned dependency set without automatic upgrades.
        arduino-cli lib install --no-deps \
          "ArduinoJson@$$ARDUINOJSON_VERSION" \
          "Adafruit SSD1306@$$ADAFRUIT_SSD1306_VERSION" \
          "Adafruit GFX Library@$$ADAFRUIT_GFX_VERSION" \
          "INA219_WE@$$INA219_WE_VERSION" \
          "ESP32Encoder@$$ESP32_ENCODER_VERSION" \
          "PID_v2@$$PID_V2_VERSION" \
          "SimpleKalmanFilter@$$SIMPLE_KALMAN_FILTER_VERSION" \
          "Adafruit ICM20X@$$ADAFRUIT_ICM20X_VERSION" \
          "Adafruit BusIO@$$ADAFRUIT_BUSIO_VERSION" \
          "Adafruit Unified Sensor@$$ADAFRUIT_SENSOR_VERSION" \
          --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml"

        cp --recursive SCServo "$$ARDUINO_USER_DIR/libraries/SCServo"
        mkdir --parents /workspace/artifacts
        arduino-cli compile \
          --config-file "$$ARDUINO_DATA_DIR/arduino-cli.yaml" \
          --fqbn "$$ESP32_FQBN" \
          --build-path /workspace/build \
          --export-binaries \
          General_Driver

  - id: package-firmware
    name: ubuntu:22.04
    entrypoint: bash
    env:
      - 'SOURCE_COMMIT_SHA=$COMMIT_SHA'
      - 'CLOUD_BUILD_ID=$BUILD_ID'
    args:
      - -ceu
      - |
        set -o pipefail
        source .cloudbuild/dev/version.env
        if [[ ! "$$SOURCE_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$$ ]]; then
          echo "A full source commit SHA is required; run this through the repository trigger." >&2
          exit 1
        fi

        bundle_dir=/workspace/artifacts/firmware
        mkdir --parents "$$bundle_dir"
        # Package only this build's explicitly named outputs. Never rebuild here.
        for image in General_Driver.ino.bin General_Driver.ino.bootloader.bin General_Driver.ino.partitions.bin; do
          if [[ ! -s "/workspace/build/$$image" ]]; then
            echo "Required build output is missing or empty: $$image" >&2
            exit 1
          fi
          cp "/workspace/build/$$image" "$$bundle_dir/$$image"
        done

        printf '{\n  "source_commit_sha": "%s",\n  "cloud_build_id": "%s",\n  "validation": "compile-validated",\n  "flash_recipe_verified": false,\n  "arduino_cli_version": "%s",\n  "esp32_core_version": "%s",\n  "fqbn": "%s",\n  "artifact_package": "ugv-general-driver",\n  "artifact_version": "%s"\n}\n' \
          "$$SOURCE_COMMIT_SHA" "$$CLOUD_BUILD_ID" "$$ARDUINO_CLI_VERSION" \
          "$$ESP32_CORE_VERSION" "$$ESP32_FQBN" "$$CLOUD_BUILD_ID" \
          > "$$bundle_dir/manifest.json"
        cp .cloudbuild/dev/version.env "$$bundle_dir/version.env"
        cat > "$$bundle_dir/README.txt" <<'EOF'
        Compile-validated firmware outputs; NOT a verified complete flash bundle.
        See manifest.json for the source commit, build ID, and board profile.
        SHA256SUMS covers the images, manifest, dependency settings, and this README.

        Before flashing, confirm the pinned core's verbose upload recipe, including
        every image, offset, and option. The core-supplied boot_app0.bin is not
        included in this archive. No flash offsets or supported command are claimed.
        Do not use Arduino IDE recompilation as a substitute for testing these bytes.
        Back up device configuration: partition changes or LittleFS mount failure
        can cause data loss. Configuration preservation has not been verified.
        EOF

        cd "$$bundle_dir"
        sha256sum General_Driver.ino.bin General_Driver.ino.bootloader.bin \
          General_Driver.ino.partitions.bin manifest.json version.env README.txt > SHA256SUMS
        sha256sum --check SHA256SUMS
        tar --create --gzip --file /workspace/artifacts/firmware.tar.gz \
          General_Driver.ino.bin General_Driver.ino.bootloader.bin \
          General_Driver.ino.partitions.bin manifest.json version.env README.txt SHA256SUMS

        # Verify the actual archive, not just the input directory.
        verify_dir=$$(mktemp --directory)
        tar --extract --gzip --file /workspace/artifacts/firmware.tar.gz --directory "$$verify_dir"
        cd "$$verify_dir"
        sha256sum --check SHA256SUMS
        cd /workspace/artifacts
        echo "Source commit: $$SOURCE_COMMIT_SHA; Cloud Build ID: $$CLOUD_BUILD_ID"
        sha256sum firmware.tar.gz

  # Sequential execution makes compilation, packaging, and upload required gates.
  # Enable direct upload only for trusted PR code; approval alone is not isolation.
  - id: upload-firmware
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts generic upload \
          --project="${_ARTIFACT_PROJECT}" \
          --location="${_ARTIFACT_LOCATION}" \
          --repository="${_ARTIFACT_REPOSITORY}" \
          --package=ugv-general-driver \
          --version="$BUILD_ID" \
          --source=/workspace/artifacts/firmware.tar.gz
        echo "Uploaded: projects/${_ARTIFACT_PROJECT}/locations/${_ARTIFACT_LOCATION}/repositories/${_ARTIFACT_REPOSITORY}/packages/ugv-general-driver/versions/$BUILD_ID"
        echo "Download into an existing directory:"
        echo "gcloud artifacts generic download --project=${_ARTIFACT_PROJECT} --location=${_ARTIFACT_LOCATION} --repository=${_ARTIFACT_REPOSITORY} --package=ugv-general-driver --version=$BUILD_ID --name=firmware.tar.gz --destination=YOUR_EXISTING_DIRECTORY"

substitutions:
  _ARTIFACT_PROJECT: ugv-base-general
  _ARTIFACT_LOCATION: australia-southeast1
  _ARTIFACT_REPOSITORY: ugv-base-general-firmware

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
